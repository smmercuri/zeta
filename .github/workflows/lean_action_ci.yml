name: Lean Action CI

on:
  push:
    # Height branches from 1e6 up are too large for a runner; build them locally.
    branches-ignore: [kernel-fastpath, '*e[6-9]*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free runner disk (the build cache save needs the headroom)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@v5
      - name: Check that Zeta.lean imports every module (scripts/mk_all.sh)
        run: scripts/mk_all.sh --check
      - uses: leanprover/lean-action@v1
      