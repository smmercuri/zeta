[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zeta"
version = "0.1.0"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["approximants", "config", "gram", "search", "util"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "test"]
testpaths = ["test"]
addopts = "--import-mode=importlib"