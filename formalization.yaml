    sorry_count: 0
    axioms: ["Quot.sound", "propext", "Classical.choice"]
    comparator_config: "comparator/Analytic/config.json"
    literature_dependencies: []
  - declaration: "Zeta.riemannHypothesisUpTo_10011"
    file: "Zeta/Main.lean"
    sorry_count: 0
    axioms: ["Quot.sound", "propext", "Classical.choice"]
