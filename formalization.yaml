# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "Riemann hypothesis up to bounded height"  # [required]
  description: "This project provides a kernel-checked proof that the Riemann hypothesis holds up 
    to a specified height on the critical line."
  authors: [Salvatore Mercuri, Bhavik Mehta]  # [required]
  responsible_maintainers: [Salvatore Mercuri, Bhavik Mehta]
  license: "Apache-2.0"  # [required]

sources:  # [required]
  - title: "Certifying the Riemann hypothesis up to bounded height (project blueprint)"
    authors: [Salvatore Mercuri, Bhavik Mehta]
    id: "https://github.com/smmercuri/zeta"
    type: "original-proof"
    location: "blueprint/src"
    relationship: "formalizes"
    note: >
      Written within the project; the kernel-checked verification of RH up to height T, its
      certificate method and their assembly are new here. The classical results it follows are
      the sources below.
    author_endorsement: "n/a"
  - title: "Note sur les zéros de la fonction ζ(s) de Riemann"
    authors: [Jørgen Pedersen Gram]
    id: "Acta Math. 27 (1903), 289-304"
    type: "article"
    location: "Gram points"
    relationship: "background"
    note: "Gram points, at which the zero counting is done."
    author_endorsement: "n/a"
  - title: "Some calculations of the Riemann zeta-function"
    authors: [Alan M. Turing]
    id: "Proc. London Math. Soc. (3) 3 (1953), 99-117"
    type: "article"
    location: "the zero-counting method"
    relationship: "adapts"
    note: "Turing's method: counting the zeros up to a height from sign changes at Gram points."
    author_endorsement: "n/a"
  - title: "On the distribution of zeros of the Riemann zeta-function"
    authors: [R. Sherman Lehman]
    id: "Proc. London Math. Soc. (3) 20 (1970), 303-320"
    type: "article"
    location: "the bound on the integral of S(t)"
    relationship: "adapts"
    note: >
      Lehman's bound |int S| <= A + B log(t2/2pi) with (A, B) = (2.30, 0.128); proved here without
      zero-freeness hypotheses at the endpoints, with A = 5.
    author_endorsement: "n/a"
  - title: "Improvements to Turing's method"
    authors: [Timothy Trudgian]
    id: "Math. Comp. 80 (2011), no. 276, 2259-2279"
    type: "article"
    location: "Lemma 2.10 (Booker's zero-pairing estimate)"
    relationship: "adapts"
    note: "Used in the Lehman bound; Trudgian's sharper constants are not used."
    author_endorsement: "not-contacted"
  - title: "Über Riemanns Nachlaß zur analytischen Zahlentheorie"
    authors: [Carl Ludwig Siegel]
    id: "Quellen und Studien zur Geschichte der Mathematik, Astronomie und Physik, Abt. B 2 (1932), 45-80"
    type: "article"
    location: "§1, §4"
    relationship: "adapts"
    note: "The derivation of the Riemann-Siegel formula, with the project's own explicit error bound."
    author_endorsement: "n/a"
  - title: "Riemann's Zeta Function"
    authors: [Harold M. Edwards]
    id: "Pure and Applied Mathematics 58, Academic Press, 1974"
    type: "book"
    location: "Ch. 7 (§7.9); §6.5-6.7"
    relationship: "background"
    note: "Exposition of the Riemann-Siegel formula and of the N(T) formula."
    author_endorsement: "n/a"
  - title: "The Theory of the Riemann Zeta-Function (2nd ed., revised by D. R. Heath-Brown)"
    authors: [E. C. Titchmarsh]
    id: "MR0882550"
    type: "book"
    location: "§9.9 (Littlewood's lemma); §§2.12, 3.1, 4.12, 9.4"
    relationship: "adapts"
    note: "Littlewood's lemma, Stirling, Hadamard factorisation and the order of xi."
    author_endorsement: "n/a"
  - title: "Multiplicative Number Theory (3rd ed.)"
    authors: [Harold Davenport]
    id: "Graduate Texts in Mathematics 74, Springer, 2000"
    type: "book"
    location: "§§8, 11, 12, 15"
    relationship: "adapts"
    note: "The explicit formula for zeta'/zeta; Hadamard factorisation; zero summability."
    author_endorsement: "n/a"
  - title: "Distribution of Zeros of Entire Functions (revised ed.)"
    authors: [B. Ja. Levin]
    id: "MR0589888; Translations of Mathematical Monographs 5, AMS, 1980"
    type: "book"
    relationship: "adapts"
    note: >
      Cartan's minimum-modulus estimate. (The blueprint's comment names Levin's "Lectures on
      Entire Functions", Lecture II, a different book, while citing this MR number.)
    author_endorsement: "n/a"
  - title: "The Theory of Functions (2nd ed.)"
    authors: [E. C. Titchmarsh]
    id: "MR3155290"
    type: "book"
    location: "§8.71"
    relationship: "adapts"
    note: "Cartan's minimum-modulus estimate."
    author_endorsement: "n/a"
  - title: "Neue Herleitung und explizite Restabschätzung der Riemann-Siegel-Formel"
    authors: [Wolfgang Gabcke]
    id: "PhD thesis, Georg-August-Universität Göttingen, 1979"
    type: "thesis"
    relationship: "background"
    note: "Cross-check of the Riemann-Siegel correction coefficients; its sharp constants are not used."
    author_endorsement: "not-contacted"
  - title: "Computational strategies for the Riemann zeta function"
    authors: [Jonathan M. Borwein, David M. Bradley, Richard E. Crandall]
    id: "J. Comput. Appl. Math. 121 (2000), 247-296"
    type: "article"
    location: "§3 (the Euler-Maclaurin error bound)"
    relationship: "adapts"
    note: "The truncation-error bound for the Euler-Maclaurin evaluation of zeta (norm_zetaRemainder_le)."
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd"
    relationship: "builds-on"
    note: >
      Used through a pinned fork (https://github.com/smmercuri/PrimeNumberTheoremAnd): the zero
      counting function riemannZeta.N and its zero sets, the rectangle-integral and residue
      calculus behind the argument principle, the finiteness and order results for zeros of
      zeta, and the Poisson-summation tools used for Riemann-Siegel. As of November 2026 it has
      only an order-1 Euler-Maclaurin formula; the general order-p formula and its remainder
      bound are this project's.
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: "The Riemann zeta function and the rest of the library the project is built on."

