  Independent checking uses leanprover/comparator and lean4export, and the blueprint uses 
  leanblueprint. The reference Python implementation uses SageMath and mpmath, and is validated 
  against the zero tables of the LMFDB. Formalization carried out with Claude Code (Anthropic).
  The certificates at height 10^8 were built on the Cirrus NCR HPC Service at EPCC
  (https://www.cirrus.ac.uk), funded by the University of Edinburgh, the Edinburgh and South East
  Scotland City Region Deal, and UKRI."
