fidelity:
  divergences: >
    The source is the project's own blueprint, so fidelity is to the blueprint and to the
    classical results it follows; the places where the Lean statements differ from those are:

    - Lehman's bound (norm_integral_argZeta_le_five_unconditional): proved with additive
    constant A = 5 in place of Lehman's 2.30, for 168 pi < t1 < t2 and with no zero-freeness
    hypothesis at t1 or t2. Weaker constants, and conditional forms, are also proved.

    - Riemann-Siegel (abs_hardyZRemainderRS_le): the two-term approximation (main sum with
    cutoff floor(sqrt T), T = t/2pi, at the order-2 Stirling approximation to theta, plus the
    corrections Psi(p) and C1(p)/sqrt T) is proved to have error at most
    25/4 T^(-5/4) + T^(-15/4)/32 for T >= 16, i.e. about 62 t^(-5/4). This is the classical
    order, but about 1200 times Gabcke's bound for the same approximation, 0.053 t^(-5/4) for
    t >= 200.

    The main reason for both divergences is that the sharper constants from the literature are 
    not needed to certify the zeros at the target heights.

